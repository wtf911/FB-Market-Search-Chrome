<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #fff; --fg: #111; --muted: #65676b; --line: #e6e8eb; --soft: #f0f2f5; --input: #fff; --border: #ccd0d5;
    --accent: #1877f2; --accent-hover: #166fe0; --btn: #e4e6eb; --btn-hover: #d8dadf; --price: #1c7c32;
    --ok: #1d7a3e; --ok-soft: #e4f4ea; --warn: #9a6700; --warn-soft: #fbf3dc; --bad: #b3261e; --bad-soft: #fbeae8;
    --danger: #c0392b; --danger-soft: #fde8e8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #242526; --fg: #e4e6eb; --muted: #b0b3b8; --line: #3a3b3c; --soft: #3a3b3c; --input: #3a3b3c; --border: #4e4f50;
      --accent: #2d88ff; --accent-hover: #4a9bff; --btn: #3a3b3c; --btn-hover: #4e4f50; --price: #7bd389;
      --ok: #7bd389; --ok-soft: #22392a; --warn: #e2b341; --warn-soft: #362c13; --bad: #f28b82; --bad-soft: #3b2626;
      --danger: #f28b82; --danger-soft: #3b2626;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { width: 340px; margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 -apple-system, Segoe UI, Roboto, sans-serif; }
  h1 { font-size: 14px; margin: 0; padding: 10px 12px; background: #1877f2; color: #fff; }
  .sec { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  label { display: block; font-weight: 600; margin: 6px 0 2px; }
  small { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=number], select { width: 100%; padding: 6px; background: var(--input); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px; font: inherit; }
  .row { display: flex; gap: 10px; align-items: flex-end; margin-top: 6px; }
  .row > * { flex: 1; min-width: 0; }
  .row.opts { align-items: center; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; }
  .row.opts label { font-weight: 400; flex: none; margin: 0; }
  button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: default; }
  button.sm { padding: 4px 8px; font-weight: 500; font-size: 12px; flex: none; }
  button.gray { background: var(--btn); color: var(--fg); }
  button.gray:hover { background: var(--btn-hover); }
  button.danger { background: var(--danger-soft); color: var(--danger); }
  button.danger:hover { filter: brightness(.95); }
  #current { color: var(--muted); font-size: 12px; word-break: break-all; }
  .note { color: var(--bad); font-size: 12px; margin-top: 6px; min-height: 0; }
  .note.ok { color: var(--ok); }
  /* activity (running / queued jobs) */
  #activity { background: var(--soft); }
  #act-row { display: flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 600; }
  #act-txt { flex: 1; font-variant-numeric: tabular-nums; }
  #act-queue { color: var(--muted); font-size: 12px; margin-top: 4px; }
  /* alerts */
  .alert { border-top: 1px solid var(--line); padding: 8px 0; }
  .alert:first-child { border-top: none; }
  .alert .title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .alert .title b { color: var(--accent); }
  .chip { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--btn); color: var(--fg); }
  .chip.ex { text-decoration: line-through; opacity: .8; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .meta { color: var(--muted); font-size: 12px; margin: 2px 0 4px; }
  .meta a { color: var(--accent); text-decoration: none; word-break: break-all; }
  .err { color: var(--bad); font-size: 12px; margin: 0 0 4px; }
  .prog { color: var(--accent); font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
  .prog:empty { display: none; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .edit { margin-top: 8px; padding: 8px; background: var(--soft); border-radius: 8px; }
  .edit label { margin-top: 4px; }
  /* results history */
  .results { margin-top: 8px; }
  .resbar { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; align-items: center; }
  .resbar button { padding: 3px 8px; font-size: 11px; font-weight: 600; background: var(--btn); color: var(--fg); }
  .resbar button.active { background: var(--accent); color: #fff; }
  .resbar .spacer { flex: 1; }
  .reslist { max-height: 280px; overflow: auto; }
  .reslist.newonly .res:not(.isnew) { display: none; }
  .reslist .empty { color: var(--muted); font-size: 12px; padding: 6px 0; }
  .res { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--fg); }
  .res:hover { background: var(--soft); }
  .res .thumb { width: 46px; height: 46px; flex: none; border-radius: 6px; overflow: hidden; background: var(--btn); display: flex; align-items: center; justify-content: center; }
  .res .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .res .info { display: flex; flex-direction: column; min-width: 0; }
  .res .price { font-weight: 700; color: var(--price); font-size: 12px; }
  .res .ttl { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .new { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
  <h1>🔔 Marketplace Description Alerts</h1>

  <div class="sec" id="activity" hidden>
    <div id="act-row"><span id="act-txt"></span><button class="sm danger" id="act-stop" type="button">Stop</button></div>
    <div id="act-queue"></div>
  </div>

  <div class="sec">
    <form id="new">
      <label>New alert from this tab</label>
      <div id="current">Open a Marketplace search/category page to create an alert.</div>
      <label for="kw">Keywords in description <small>(comma-separated · "quoted phrase" · -exclude)</small></label>
      <input id="kw" type="text" placeholder='e.g. sea view, "15,000", -agent' autocomplete="off" />
      <div class="row">
        <div><label for="interval">Check every</label><select id="interval"></select></div>
        <div id="interval-custom-wrap" hidden><label for="interval-custom">Minutes</label><input id="interval-custom" type="number" min="15" max="1440" placeholder="≥ 15" /></div>
        <div><label for="max">Max scan</label><input id="max" type="number" value="40" min="1" max="200" /></div>
      </div>
      <div class="row opts">
        <label><input id="all" type="checkbox" /> match all</label>
        <label><input id="titles" type="checkbox" /> search titles too</label>
        <label><input id="word" type="checkbox" /> whole words</label>
      </div>
      <div class="row">
        <div><label for="conc">Parallel tabs</label><input id="conc" type="number" value="2" min="1" max="3" /></div>
        <div><label for="pmin">Price min</label><input id="pmin" type="number" min="0" placeholder="any" /></div>
        <div><label for="pmax">Price max</label><input id="pmax" type="number" min="0" placeholder="any" /></div>
      </div>
      <label for="name">Name <small>(optional)</small></label>
      <input id="name" type="text" maxlength="60" placeholder="e.g. Choeng Mon rentals" />
      <button id="save" type="submit" style="width:100%;margin-top:10px">Save alert</button>
      <div id="note" class="note"></div>
    </form>
  </div>

  <div class="sec">
    <label>Active alerts</label>
    <div id="alerts"><small>None yet.</small></div>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
