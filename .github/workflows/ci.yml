name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run e2e
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: "*.zip"
